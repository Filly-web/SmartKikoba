services:
  - type: web
    name: visionaries-smart-kikoba
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visionaries-kikoba-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi.py
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
databases:
  - name: visionaries-kikoba-db
    databaseName: visionaries_kikoba
    user: visionaries_kikoba
