services:
  - type: web
    name: visionaries-smart-kikoba
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi.py init-db && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: wsgi.py
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
