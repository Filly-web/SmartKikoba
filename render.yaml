# Existing Render service configuration.
# Keep the existing DATABASE_URL value in the Render dashboard. This blueprint
# intentionally does not declare a Render database resource or create a new DB.
services:
  - type: web
    name: visionaries-smart-kikoba
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi.py init-db && gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi.py
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
