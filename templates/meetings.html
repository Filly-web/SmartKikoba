{% extends "base.html" %}{% block content %}<h2>Group meetings & governance</h2>
<div class="panel mb-3"><form method="post" class="row g-2"><div class="col-md-3"><label>Date</label><input type="date" name="meeting_date" class="form-control" required></div><div class="col-md-9"><label>Meeting title</label><input name="title" class="form-control" required></div><div class="col-md-4"><label>Attendance</label><textarea name="attendance" class="form-control"></textarea></div><div class="col-md-4"><label>Minutes</label><textarea name="minutes" class="form-control"></textarea></div><div class="col-md-4"><label>Resolutions</label><textarea name="resolutions" class="form-control"></textarea></div><div><button class="btn btn-primary">Save meeting</button></div></form></div>
{% for m in rows %}<div class="panel mb-2"><h5>{{m.title}} · {{m.meeting_date}}</h5><p><b>Attendance:</b> {{m.attendance}}</p><p><b>Minutes:</b> {{m.minutes}}</p><p><b>Resolutions:</b> {{m.resolutions}}</p></div>{% else %}<p>No meetings recorded.</p>{% endfor %}{% endblock %}
