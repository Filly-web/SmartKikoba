{% extends "base.html" %}{% block content %}<div class="page-heading"><div><div class="eyebrow">CONTROL ENVIRONMENT</div><h2 class="page-title">Audit Trail</h2></div></div><div class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Record</th><th>ID</th><th>Reason</th></tr></thead><tbody>{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{x.actor_id or 'System'}}</td><td>{{x.action}}</td><td>{{x.record_type}}</td><td>{{x.record_id or '—'}}</td><td>{{x.reason or '—'}}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
