{% extends "base.html" %}{% block content %}<div class="page-heading"><div><div class="eyebrow">GROUP ADMINISTRATION</div><h2 class="page-title">Members</h2></div></div>
<div class="row g-3"><div class="col-lg-4"><div class="panel"><h5>Add member</h5><form method="post"><label>Member number</label><input class="form-control mb-2" name="member_no" required><label>Full name</label><input class="form-control mb-2" name="full_name" required><label>Phone</label><input class="form-control mb-2" name="phone"><label>Email</label><input class="form-control mb-3" name="email"><button class="btn btn-primary">Save member</button></form></div></div>
<div class="col-lg-8"><div class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Member No.</th><th>Name</th><th>Phone</th><th>Status</th></tr></thead><tbody>{% for m in members %}<tr><td>{{m.member_no}}</td><td>{{m.full_name}}</td><td>{{m.phone or '—'}}</td><td><span class="status">{{'Active' if m.active else 'Inactive'}}</span></td></tr>{% else %}<tr><td colspan="4">No members registered.</td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
